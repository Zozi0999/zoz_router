<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#00FFC2" />
      <stop offset="100%" stop-color="#FF5200" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#08090D" />
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="url(#glowGrad)" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Outer Hexagon Router Orbit -->
  <polygon points="50,15 80,32 80,68 50,85 20,68 20,32" stroke="#00F0FF" stroke-width="2.5" fill="none" opacity="0.6" filter="url(#neonGlow)"/>
  
  <!-- Inner Z Logo / Neural Node -->
  <path d="M30 32 H70 L30 68 H70" stroke="url(#glowGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>
  
  <!-- Orbital Nodes -->
  <circle cx="50" cy="15" r="3.5" fill="#00FFC2" filter="url(#neonGlow)"/>
  <circle cx="80" cy="50" r="3.5" fill="#00F0FF" filter="url(#neonGlow)"/>
  <circle cx="20" cy="50" r="3.5" fill="#FF5200" filter="url(#neonGlow)"/>
  <circle cx="50" cy="85" r="3.5" fill="#00FFC2" filter="url(#neonGlow)"/>
</svg>
